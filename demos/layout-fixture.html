<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mbox layout fixture</title>
    <style>
      body {
        margin: 0;
      }

      #editor {
        width: 720px;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <h1 id="fixture-editor-heading" class="visually-hidden">Fixture editor</h1>
    <div id="editor"></div>
    <script type="module" src="/demos/layout-fixture.ts"></script>
  </body>
</html>
